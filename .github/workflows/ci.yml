name: CI

env:
  JDK_JAVA_OPTIONS: -XX:+PrintCommandLineFlags # JDK_JAVA_OPTIONS is _the_ env. variable to use for modern Java
  JVM_OPTS: -XX:+PrintCommandLineFlags # for Java 8 only (sadly, it is not modern enough for JDK_JAVA_OPTIONS)

on:
  pull_request:
  push:
    branches: ['series/2.x']
  release:
    types:
      - published

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java (temurin@21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - uses: coursier/setup-action@v1
        with:
          apps: sbt

      - name: Lint code
        run: sbt check

  mdoc:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Setup Java (temurin@21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - uses: coursier/setup-action@v1
        with:
          apps: sbt

      - name: Check Document Generation
        run: sbt docs/compileDocs

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['corretto@21']
        scala: ['2.12.20', '2.13.17', '3.3.3']
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v3.5.1
        with:
          fetch-depth: 0
      - name: Setup Scala and Java
        uses: coursier/setup-action@v1
        with:
          java-version: ${{ matrix.java }}
          scala-version: 2.13.17
      - name: Cache scala dependencies
        uses: coursier/cache-action@v6

      - name: Setup Java (temurin@17)
        if: matrix.java == 'temurin@17'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: Setup Java (temurin@21)
        if: matrix.java == 'temurin@21'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - uses: coursier/setup-action@v1
        with:
          apps: sbt

      - name: Start containers
        run: |
            chmod -R 777 ./zio-ftp/ftp-home/
            docker compose -f "docker-compose.yml" up -d --build
            chmod -R 777 ./zio-ftp/ftp-home/sftp/home/foo/dir1
      - name: Test
        run: sbt ++${{ matrix.scala }} zio-ftp/test

  testJvms:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java (temurin@17)
        if: matrix.java == 'temurin@17'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: Setup Java (temurin@21)
        if: matrix.java == 'temurin@21'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - uses: coursier/setup-action@v1
        with:
          apps: sbt

      - name: Start containers
        run: |
          chmod -R 777 ./zio-ftp/ftp-home/
          docker compose -f "docker-compose.yml" up -d --build
          chmod -R 777 ./zio-ftp/ftp-home/sftp/home/foo/dir1
      - name: Test
        run: sbt test

  ci:
    runs-on: ubuntu-24.04
    needs: [lint, mdoc, test, testJvms]
    steps:
      - name: Report successful build
        run: echo "ci passed"

  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [ci]
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java (temurin@21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - uses: coursier/setup-action@v1
        with:
          apps: sbt

      - name: Release artifacts
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}